[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tzoffset"
version = "1.0.0"
description = "Parse and format bare numeric UTC offsets (Z, +05:30, -0800) both ways"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["utc offset", "timezone", "time zone", "rfc3339", "rfc9557", "iso8601", "datetime", "parser", "formatter", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# tzdata gives zoneinfo a database on Windows; python-dateutil and rfc3339-validator are
# independent parsers the tests compare against. None of them is needed at run time.
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-timeout",
    "build",
    "twine",
    "tzdata",
    "python-dateutil",
    "rfc3339-validator",
]

[project.scripts]
tzoffset = "tzoffset._cli:main"

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/tzoffset"
Issues = "https://github.com/JaviLianes8/tzoffset/issues"
Documentation = "https://github.com/JaviLianes8/tzoffset/blob/main/GUIDE.md"
Changelog = "https://github.com/JaviLianes8/tzoffset/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party sources are fetched locally and never shipped; only their manifest is.
# hatchling always ships .gitignore, so it is not listed here.
exclude = [
    ".github",
    ".gitattributes",
    "IMPROVEMENTS-round*.md",
    "CERT-1.0-*.md",
    "tests/vectors/sources/*",
    "!tests/vectors/sources/MANIFEST.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tzoffset"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
timeout = 300
